<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="100%" height="100%">
  <style>
    .ladle-stir {
      animation: stirMotion 2.5s infinite ease-in-out;
      transform-origin: 20px 20px;
    }
    @keyframes stirMotion {
      0% { transform: rotate(0deg); }
      50% { transform: rotate(15deg) translateY(4px); }
      100% { transform: rotate(0deg); }
    }
  </style>
  <circle cx="40" cy="40" r="36" fill="#0E2018" stroke="#E8C84D" stroke-width="2"/>
  <g class="ladle-stir">
    <line x1="20" y1="20" x2="52" y2="52" stroke="#E8C84D" stroke-width="4" stroke-linecap="round"/>
    <ellipse cx="56" cy="56" rx="10" ry="6" fill="#AA820A" stroke="#E8C84D" stroke-width="1.5" transform="rotate(-45 56 56)"/>
  </g>
  <circle cx="62" cy="45" r="2.5" fill="#25D366"/>
</svg>